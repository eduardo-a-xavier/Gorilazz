name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} - Sintaxe e Testes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validar sintaxe (node --check)
        run: npm run check

      - name: Executar suíte de testes (node --test)
        run: npm test

  # Job separado de smoke em Chromium headless (SwiftShader) sob /Gorilazz/:
  # valida 0 erros de console/página, 0 HTTP >= 400, mundo 3D carregado e Passeio Guiado
  # com TOUR_ORDER fixa de 9 paradas. Separado do job `test` para não atrasar os testes
  # unitários em Node e com timeout generoso devido ao WebGL em software (SwiftShader).
  browser-smoke:
    name: Chromium Headless — Smoke /Gorilazz/
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install chromium --with-deps

      - name: Executar smoke E2E sob /Gorilazz/
        run: python scripts/ci-smoke-subpath.py
