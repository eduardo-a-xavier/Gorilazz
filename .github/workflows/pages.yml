name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verificar sintaxe e testes
        run: |
          npm run check
          npm test
      - name: Montar o site estático
        # Publica somente o que server.mjs já serve (index.html, src/ e assets/ listados),
        # sem docs/, tests/, artifacts/ nem arquivos fora dessa lista.
        run: |
          node --input-type=module -e "
          import { readFileSync, mkdirSync, copyFileSync, writeFileSync, existsSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          const source = readFileSync('server.mjs', 'utf8');
          const files = new Set([...source.matchAll(/\['\/[^']*',\s*\['([^']+)'/g)].map(m => m[1]));
          if (files.size < 50) throw new Error('Lista de rotas inesperada: ' + files.size);
          for (const file of files) {
            if (!existsSync(file)) throw new Error('Arquivo ausente: ' + file);
            mkdirSync(join('_site', dirname(file)), { recursive: true });
            copyFileSync(file, join('_site', file));
          }
          writeFileSync('_site/.nojekyll', '');
          console.log(files.size + ' arquivos copiados para _site');
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
